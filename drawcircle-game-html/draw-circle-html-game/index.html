<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Perfect Circle — 원 그리기 테스트</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <section class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MOUSE CONTROL TEST</p>
          <h1>PERFECT CIRCLE</h1>
        </div>
        <button id="soundBtn" class="icon-btn" type="button" aria-label="효과음 켜기 또는 끄기">🔊</button>
      </header>

      <section class="statusbar">
        <div class="round-box">
          <span>ROUND</span>
          <strong><b id="roundText">1</b> / 5</strong>
        </div>
        <div class="score-box">
          <span>현재 평균</span>
          <strong id="averageText">-</strong>
        </div>
        <div class="best-box">
          <span>BEST</span>
          <strong id="bestText">-</strong>
        </div>
      </section>

      <section class="canvas-area">
        <canvas id="gameCanvas"></canvas>

        <div id="introOverlay" class="overlay">
          <article class="modal-card intro-card">
            <span class="pill">HOW TO PLAY</span>
            <h2>초록색 선 끝에서 시작해<br>완벽한 원을 그려보세요.</h2>
            <p>
              초록색 선의 길이가 원의 반지름입니다.<br>
              마우스나 손가락을 누른 채 한 바퀴를 그린 뒤 놓으세요.
            </p>
            <button id="startBtn" class="primary-btn" type="button">테스트 시작</button>
          </article>
        </div>

        <div id="roundOverlay" class="overlay overlay--light" hidden>
          <article class="modal-card result-card">
            <span class="pill">ROUND SCORE</span>
            <strong id="roundScore" class="huge-score">0.0</strong>
            <p id="roundComment">좋은 출발이에요!</p>
            <div class="metric-grid">
              <div><span>원형 정확도</span><b id="shapeMetric">0</b></div>
              <div><span>완성도</span><b id="closureMetric">0</b></div>
              <div><span>반지름 정확도</span><b id="radiusMetric">0</b></div>
            </div>
            <button id="nextBtn" class="primary-btn" type="button">다음 라운드</button>
          </article>
        </div>

        <div id="finalOverlay" class="overlay" hidden>
          <article class="modal-card final-card">
            <span class="pill">FINAL SCORE</span>
            <p>당신의 원 그리기 점수는</p>
            <strong id="finalScore" class="huge-score">0.0</strong>
            <h2 id="finalGrade">평가중입니다...</h2>
            <p id="recordText" class="record-text"></p>
            <div id="scoreList" class="score-list"></div>
            <div class="button-row">
              <button id="resetBtn" class="secondary-btn" type="button">기록 초기화</button>
              <button id="retryBtn" class="primary-btn" type="button">다시하기</button>
            </div>
          </article>
        </div>
      </section>

      <footer class="hint">
        <span class="hint-dot"></span>
        초록색 선 끝에서 누르기 시작하고 시계 방향으로 한 바퀴를 그리세요.
      </footer>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
